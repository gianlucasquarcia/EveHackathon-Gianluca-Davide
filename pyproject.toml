[project]
name = "fastmcp-test"
version = "1.1.1"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.5",
    "typer>=0.27.2",
    "pytest>=8.4.0",
    "requests>=2.34.2",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "coverage>=7.16.1",
    # griffelib 2.3.1 imports enum.StrEnum, which breaks Python 3.10
    "griffelib<2.4",
    "xarray>=2025.6.1",
    "netcdf4>=1.7.3",
    "ncvue>=6.6",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = [".", "servers/ceda_opensearch"]
extend-exclude = ["servers/ceda_opensearch/venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument, common in FastMCP signatures
    "SIM108", # ternary operator is a readability preference
    "SIM117", # nested with is often required by MCP SDK async contexts
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "SIM105"]

[tool.coverage.run]
source = ["mcp_server", "mcp_server_cli", "settings"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "tox>=4.64.6",
    "tox-uv>=1.36.0",
]
